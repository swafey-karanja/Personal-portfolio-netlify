<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Portfolio</title>

    <link rel="icon" type="image/png" href="/images/logo-top.png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"DM Serif Display"', "Georgia", "serif"],
              sans: ['"DM Sans"', "sans-serif"],
            },
            colors: {
              ink: "#0d0d0d",
              paper: "#f8f7f4",
              accent: "#e8e0d4",
              muted: "#666666",
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "DM Sans", sans-serif;
        background: #f8f7f4;
        color: #0d0d0d;
      }

      /* ── Reveal animation ── */
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.65s ease,
          transform 0.65s ease;
      }
      .reveal.visible {
        opacity: 1;
        transform: none;
      }

      /* ── Nav link underline ── */
      .nav-link {
        position: relative;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2.5px;
        background: #0d0d0d;
        transition: width 0.6s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }

      /* ── Skill card hover ── */
      .skill-card {
        transition:
          /* background 0.25s, */
          transform 300ms
          /*box-shadow 0.25s;*/
      }
      .skill-card:hover {
        color: #000000;
        transform: translateY(-10px);
        /*box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);*/
      }

      /* ── Project image zoom ── */
      .project-img-wrap {
        overflow: hidden;
      }

      /* ── Testimonial active ── */
      /*.testi-card.active {*/
      /*  background: #0d0d0d;*/
      /*  color: #f8f7f4;*/
      /*}*/
      /*.testi-card.active .testi-role {*/
      /*  color: #aaa;*/
      /*}*/

      /* ── Section separator ── */
      .section-rule {
        border: none;
        border-top: 1px solid #d4cfc9;
      }

      /* ── Input focus ── */
      .form-input {
        transition: border-color 0.2s;
      }
      .form-input:focus {
        outline: none;
        border-color: #ffffff;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #f8f7f4;
      }
      ::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 9px;
      }
    </style>

    <!-- Data file must be loaded before this script -->
    <script src="data.js"></script>
  </head>

  <body class="antialiased">
    <!-- ══════════════════════════════════════════
       NAVIGATION
  ══════════════════════════════════════════ -->
    <nav
      id="navbar"
      class="fixed top-0 inset-x-0 z-50 bg-paper/90 backdrop-blur border-b border-accent transition-shadow duration-300"
    >
      <div
        class="max-w-7xl mx-auto px-6 pt-2 flex items-center justify-between"
      >
        <div id="nav-brand" class="relative aspect-square"></div>
        <!-- Desktop links -->
        <ul
          id="nav-links"
          class="hidden md:flex gap-8 text-md font-semibold"
        ></ul>
        <!-- Resume button -->
        <a
          id="nav-resume"
          target="_blank"
          href="https://drive.google.com/file/d/1MZDbnktlIj3fVXFCJqyIG-6R33TxwKp_/view?usp=drive_link"
          class="hidden md:inline-flex items-center gap-2 bg-ink text-paper text-sm font-medium px-5 py-2.5 rounded-full border border-black hover:bg-paper hover:text-ink transition"
        >
          Resume <i class="fas fa-arrow-up-right-from-square text-xs"></i>
        </a>
        <!-- Mobile hamburger -->
        <button
          id="menu-toggle"
          class="md:hidden text-ink"
          aria-label="Toggle menu"
        >
          <i class="fas fa-bars text-xl"></i>
        </button>
      </div>
      <!-- Mobile menu -->
      <div
        id="mobile-menu"
        class="hidden md:hidden px-6 pb-4 border-t border-accent"
      >
        <ul
          id="mobile-links"
          class="flex flex-col gap-4 pt-4 text-sm font-medium"
        ></ul>
      </div>
    </nav>

    <!-- ══════════════════════════════════════════
       HERO
  ══════════════════════════════════════════ -->
    <section id="About Me" class="min-h-screen flex flex-col items-center justify-center pt-24 pb-16">
      <div
        class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center"
      >
        <!-- Text -->
        <div class="reveal">
          <p id="hero-greeting" class="text-muted text-lg mb-1 font-light"></p>
          <h1
            id="hero-name"
            class="font-serif text-5xl md:text-6xl lg:text-7xl leading-tight mb-1"
          ></h1>
          <h2
            id="hero-title"
            class="font-serif italic text-4xl md:text-5xl text-muted mb-3"
          ></h2>
          <p id="hero-location" class="text-lg font-medium mb-6"></p>
          <p
            id="hero-bio"
            class="space-y-4 text-muted text-sm leading-relaxed max-w-2xl"
          ></p>
          <div id="hero-socials" class="flex gap-3 mt-6"></div>
        </div>
        <!-- Illustration -->
        <div class="reveal flex justify-center" style="transition-delay: 0.15s">
          <div class="relative aspect-3/4 w-full w-full">
            <img
              src="images/developer-removebg.png"
              alt="Abstract geometric person illustration"
              class="w-full h-full object-cover rounded-2xl"
            />
          </div>
        </div>
      </div>
      <div class="flex flex-col items-center justify-center mt-36 gap-6">
        <span class="text-[15px] font-semibold uppercase tracking-[0.4em] text-ink/30 mb-4">
          Scroll to Learn More about Me
        </span>

        <div class="w-12 h-20 border border-ink/50 rounded-full flex justify-center pt-8">
          <i class="fas fa-chevron-down text-lg text-ink animate-bounce"></i>
        </div>
      </div>
    </section>

    <hr class="section-rule max-w-7xl mx-auto px-6" />

    <!-- ══════════════════════════════════════════
       SKILLS
  ══════════════════════════════════════════ -->
    <section id="Skills" class="py-20">
      <div class="max-w-7xl mx-auto px-6">
        <h2 class="font-serif text-4xl text-center mb-12 reveal">
          My <span class="font-serif italic">Skills</span>
        </h2>
        <div
          id="skills-grid"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"
        ></div>
      </div>
    </section>

    <hr class="section-rule max-w-7xl mx-auto px-6" />

    <!-- ══════════════════════════════════════════
       EXPERIENCE
  ══════════════════════════════════════════ -->
    <section class="py-20 bg-ink text-paper" id="Experience">
      <div class="max-w-7xl mx-auto px-6">
        <h2 class="font-serif text-4xl text-center mb-14 reveal">
          My <span class="font-serif italic">Experience</span>
        </h2>
        <div id="experience-list" class="space-y-0"></div>
      </div>
    </section>

    <!-- ══════════════════════════════════════════
       ABOUT
  ══════════════════════════════════════════ -->
    <section id="About" class="py-20">
      <div
        class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center"
      >
        <!-- Illustration -->
        <div class="reveal flex justify-center">
          <div class="relative w-64 h-64 md:w-80 md:h-80">
            <img
              src="images/locks.png"
              alt="Abstract geometric person illustration"
              class="w-full h-full object-cover rounded-2xl"
            />
          </div>
        </div>
        <!-- Text -->
        <div class="reveal" style="transition-delay: 0.1s">
          <h2 class="font-serif text-4xl mb-8">
            About <span class="font-serif italic">Me</span>
          </h2>
          <div
            id="about-text"
            class="space-y-4 text-muted text-sm leading-relaxed"
          ></div>
        </div>
      </div>
    </section>

    <hr class="section-rule max-w-7xl mx-auto px-6" />

    <!-- ══════════════════════════════════════════
      Personal PROJECTS
 ══════════════════════════════════════════ -->
    <section id="Personal-projects" class="py-20 bg-ink text-paper">
      <div class="max-w-7xl mx-auto px-6">
        <h2 class="font-serif text-4xl text-center mb-14 reveal">
          My <span class="font-serif italic">Personal Projects</span>
        </h2>
        <div id="personal-projects-list" class="space-y-20"></div>
      </div>
    </section>

    <!-- ══════════════════════════════════════════
       WORK PROJECTS
  ══════════════════════════════════════════ -->
    <section id="Projects" class="py-20">
      <div class="max-w-7xl mx-auto px-6">
        <h2 class="font-serif text-4xl text-center mb-14 reveal">
          My <span class="font-serif italic">Professional Work</span>
        </h2>
        <div id="projects-list" class="space-y-20"></div>
      </div>
    </section>

    <!-- ══════════════════════════════════════════
       TESTIMONIALS
  ══════════════════════════════════════════ -->
    <!-- <section class="py-20">
      <div class="max-w-7xl mx-auto px-6">
        <h2 class="font-serif text-4xl text-center mb-12 reveal">
          My <span class="font-serif italic">Testimonial</span>
        </h2>
        <div id="testimonials-grid" class="grid md:grid-cols-3 gap-6"></div>
      </div>
    </section>

    <hr class="section-rule max-w-7xl mx-auto px-6" /> -->

    <!-- ══════════════════════════════════════════
       CONTACT
  ══════════════════════════════════════════ -->
    <section id="Contact Me" class="py-20 bg-ink text-paper">
      <div
        class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-start"
      >
        <!-- Form -->
        <div class="reveal space-y-4">
          <input
            aria-label="Name"
            id="cf-name"
            type="text"
            placeholder="Your Name"
            class="form-input w-full border border-accent bg-transparent px-4 py-3 rounded-lg text-sm"
          />
          <input
            id="cf-email"
            aria-label="Email"
            type="email"
            placeholder="Email"
            class="form-input w-full border border-accent bg-transparent px-4 py-3 rounded-lg text-sm"
          />
          <input
            id="cf-project"
            aria-label="Project"
            type="text"
            placeholder="Your Project (Purpose)"
            class="form-input w-full border border-accent bg-transparent px-4 py-3 rounded-lg text-sm"
          />
          <textarea
            id="cf-message"
            aria-label="Message"
            placeholder="Your Message"
            rows="4"
            class="form-input w-full border border-accent bg-transparent px-4 py-3 rounded-lg text-sm resize-none"
          ></textarea>
          <button
            id="cf-submit"
            class="bg-paper text-ink font-medium text-sm px-8 py-3 rounded-full border border-white/80 hover:bg-ink hover:text-paper transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Get In Touch
          </button>
          <p id="cf-status" class="text-sm hidden"></p>
        </div>
        <!-- Info -->
        <div class="reveal" style="transition-delay: 0.12s">
          <h2
            id="contact-heading"
            class="font-serif text-4xl md:text-5xl leading-tight mb-6"
          ></h2>
          <p
            id="contact-subtext"
            class="text-muted text-sm leading-relaxed mb-8"
          ></p>
          <div class="space-y-3">
            <a
              id="contact-email"
              href="#"
              class="flex items-center gap-3 text-sm group"
            >
              <span
                class="w-9 h-9 flex items-center justify-center border border-accent rounded-full group-hover:bg-ink group-hover:text-paper transition text-xs"
              >
                <i class="fas fa-envelope"></i>
              </span>
              <span class="group-hover:underline"></span>
            </a>
            <a
              id="contact-phone"
              href="#"
              class="flex items-center gap-3 text-sm group"
            >
              <span
                class="w-9 h-9 flex items-center justify-center border border-accent rounded-full group-hover:bg-ink group-hover:text-paper transition text-xs"
              >
                <i class="fas fa-phone"></i>
              </span>
              <span class="group-hover:underline"></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- ══════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════ -->
    <footer class="bg-ink pt-4 pb-2 border-t border-gray-400">
      <div
        class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm"
      >
        <div id="footer-brand" class="relative aspect-square"></div>
        <span id="footer-copy" class="text-paper/50 text-xs"></span>
      </div>
    </footer>

    <!-- ══════════════════════════════════════════
       RENDER SCRIPT
  ══════════════════════════════════════════ -->
    <script>
      (function () {
        const d = portfolioData;

        // ── Nav ──────────────────────────────────────
        document.getElementById("nav-brand").innerHTML = `
            <img 
                src="${d.nav.brandImage}" 
                alt="Logo"
                class="h-20 w-auto"
            />
        `;
        document.getElementById("nav-resume").href = d.nav.resumeUrl;
        const navUl = document.getElementById("nav-links");
        const mobileUl = document.getElementById("mobile-links");

        const scrollOffset = 100; // adjust based on your navbar height

        d.nav.links.forEach((link) => {
          const li = document.createElement("li");

          li.innerHTML = `
            <a href="#${link}" class="nav-link text-ink hover:text-ink transition">
              ${link}
            </a>
          `;

          const anchor = li.querySelector("a");

          anchor.addEventListener("click", (e) => {
            e.preventDefault();

            const section = document.getElementById(link);

            if (section) {
              const sectionTop =
                section.getBoundingClientRect().top +
                window.pageYOffset -
                scrollOffset;

              window.scrollTo({
                top: sectionTop,
                behavior: "smooth",
              });
            }
          });

          navUl.appendChild(li);

          const li2 = li.cloneNode(true);
          const anchor2 = li2.querySelector("a");

          anchor2.addEventListener("click", (e) => {
            e.preventDefault();

            const section = document.getElementById(link);

            if (section) {
              const sectionTop =
                section.getBoundingClientRect().top +
                window.pageYOffset -
                scrollOffset;

              window.scrollTo({
                top: sectionTop,
                behavior: "smooth",
              });
            }
          });

          mobileUl.appendChild(li2);
        });
        document.getElementById("menu-toggle").addEventListener("click", () => {
          document.getElementById("mobile-menu").classList.toggle("hidden");
        });

        // ── Hero ─────────────────────────────────────
        document.getElementById("hero-greeting").textContent = d.hero.greeting;
        document.getElementById("hero-name").textContent = d.hero.name;
        document.getElementById("hero-title").textContent = d.hero.title;
        document.getElementById("hero-location").textContent = d.hero.location;
        const herobioEl = document.getElementById("hero-bio");
        d.hero.bio.paragraphs.forEach((p) => {
          herobioEl.insertAdjacentHTML("beforeend", `<p>${p}</p>`);
        });
        // document.getElementById("hero-bio").textContent = d.hero.bio;
        const socialsEl = document.getElementById("hero-socials");
        d.hero.socials.forEach((s) => {
          socialsEl.insertAdjacentHTML(
            "beforeend",
            `<a href="${s.url}" target="_blank" aria-label="${s.label}"
           class="w-12 h-12 flex items-center justify-center border border-accent rounded-full text-ink hover:bg-ink hover:text-paper hover:border-ink transition text-2xl">
           <i class="${s.icon}"></i>
         </a>`,
          );
        });

        // ── Skills ───────────────────────────────────
        const skillsGrid = document.getElementById("skills-grid");
        d.skills.forEach((sk, i) => {
          const isImage =
                  sk.icon.startsWith("/") ||
                  sk.icon.startsWith("https") ||
                  /\.(png|jpg|jpeg|svg|webp|gif)$/i.test(sk.icon);

          skillsGrid.insertAdjacentHTML(
          "beforeend",
          `<div class="skill-card reveal border border-accent rounded-md flex flex-col items-center justify-center gap-3 py-7 cursor-default" style="transition-delay:${i * 0.03}s">

            ${
                isImage
                  ? `<img src="${sk.icon}" alt="${sk.name}" class="w-14 h-14 object-contain">`
                  : `<i class="${sk.icon} text-5xl"></i>`
              }
            <span class="text-xs font-medium tracking-wide">${sk.name}</span>
          </div>`,
          );
        });

        // ── Experience ───────────────────────────────
        const expList = document.getElementById("experience-list");
        d.experience.forEach((exp, i) => {
          const isLast = i === d.experience.length - 1;
          expList.insertAdjacentHTML(
            "beforeend",
            `<div class="reveal py-8 ${isLast ? "" : "border-b border-paper/10"}" style="transition-delay:${i * 0.1}s">
           <div class="flex flex-col md:flex-row md:items-start gap-5">
             <div class="flex-shrink-0 w-11 h-11 rounded-full bg-paper/10 flex items-center justify-center bg-white">
               <img src="${exp.logo}" alt="${exp.company}" class="w-full h-full object-contain p-1" style="color:${exp.logoColor}">
             </div>
             <div class="flex-1">
               <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 mb-2">
                 <h3 class="font-semibold text-base">${exp.role}</h3>
                 <span class="text-paper/50 text-xs flex-shrink-0">${exp.period}</span>
               </div>
               <p class="text-paper/60 text-sm leading-relaxed">${exp.description}</p>
             </div>
           </div>
         </div>`,
          );
        });

        // ── About ─────────────────────────────────────
        const aboutEl = document.getElementById("about-text");
        d.about.paragraphs.forEach((p) => {
          aboutEl.insertAdjacentHTML("beforeend", `<p>${p}</p>`);
        });

        // ──Work Projects ──────────────────────────────────
        const projList = document.getElementById("projects-list");
        d.projects.forEach((proj, i) => {
          const isEven = i % 2 === 0;
          projList.insertAdjacentHTML(
            "beforeend",
            `<div class="reveal grid md:grid-cols-2 gap-10 items-center" style="transition-delay:${i * 0.1}s">
           ${
             isEven
               ? `
             <div class="project-img-wrap rounded-2xl overflow-hidden">
               <img src="${proj.image}" alt="${proj.title}" class="w-full h-72 object-cover" />
             </div>
             <div>
               <span class="font-serif italic text-5xl text-paper/20 leading-none block mb-3">${proj.number}</span>
               <h3 class="font-serif text-2xl mb-4">${proj.title}</h3>
               <p class="text-ink/60 text-sm leading-relaxed mb-6">${proj.description}</p>
               <a href="${proj.liveUrl}" target="_blank" class="inline-flex items-center gap-2 border border-paper/30 text-paper text-sm px-5 py-2 rounded-full hover:bg-paper hover:text-ink transition">
                 View Live <i class="fas fa-arrow-up-right-from-square text-xs"></i>
               </a>
             </div>
           `
               : `
             <div class="order-2 md:order-1">
               <span class="font-serif italic text-5xl text-paper/20 leading-none block mb-3">${proj.number}</span>
               <h3 class="font-serif text-2xl mb-4">${proj.title}</h3>
               <p class="text-ink/60 text-sm leading-relaxed mb-6">${proj.description}</p>
               <a href="${proj.liveUrl}" target="_blank" class="inline-flex items-center gap-2 border border-paper/30 text-paper text-sm px-5 py-2 rounded-full hover:bg-paper hover:text-ink transition">
                 View Live <i class="fas fa-arrow-up-right-from-square text-xs"></i>
               </a>
             </div>
             <div class="project-img-wrap rounded-2xl overflow-hidden order-1 md:order-2">
               <img src="${proj.image}" alt="${proj.title}" class="w-full h-72 object-cover" />
             </div>
           `
           }
         </div>`,
          );
        });


        // ──Perosnal Projects ──────────────────────────────────
        const personalprojList = document.getElementById("personal-projects-list");
        d.personal_projects.forEach((proj, i) => {
          const isEven = i % 2 === 0;
          personalprojList.insertAdjacentHTML(
          "beforeend",
          `<div class="reveal grid md:grid-cols-2 gap-10 items-center" style="transition-delay:${i * 0.1}s">
            ${
              isEven ?
               `<div class="project-img-wrap rounded-2xl overflow-hidden">
                    <img src="${proj.image}" alt="${proj.title}" class="w-full max-h-130 object-cover" />
                 </div>
                 <div>
                    <span class="font-serif italic text-5xl text-paper/60 leading-none block mb-3">${proj.number}</span>
                    <h3 class="font-serif text-2xl mb-4">${proj.title}</h3>
                    <p class="text-sm text-paper/60 leading-relaxed mb-6">
                      ${proj.description.replace(/\n\n/g, "<br><br>")}
                    </p>
                    <a href="${proj.gitUrl}" target="_blank" class="inline-flex items-center gap-2 border border-ink/30 text-ink text-sm px-5 py-2 rounded-full hover:bg-ink hover:text-paper transition">
                        View on Github <i class="fas fa-arrow-up-right-from-square text-xs"></i>
                     </a>
                 </div>`
              :
              `<div class="order-2 md:order-1">
                  <span class="font-serif italic text-5xl text-paper/60 leading-none block mb-3">${proj.number}</span>
                  <h3 class="font-serif text-2xl mb-4">${proj.title}</h3>
                   <p class="text-sm text-paper/60 leading-relaxed mb-6">
                    ${proj.description.replace(/\n\n/g, "<br><br>")}
                  </p>
                  <a href="${proj.gitUrl}" target="_blank" class="inline-flex items-center gap-2 border border-ink/30 text-ink text-sm px-5 py-2 rounded-full hover:bg-ink hover:text-paper transition">
                      View on Github <i class="fas fa-arrow-up-right-from-square text-xs"></i>
                  </a>
               </div>
               <div class="project-img-wrap rounded-2xl overflow-hidden order-1 md:order-2">
                    <img src="${proj.image}" alt="${proj.title}" class="w-full max-h-130 object-cover" />
               </div>
             `
            }
         </div>`,
          );
        });

        // ── Testimonials ──────────────────────────────
        // const testiGrid = document.getElementById("testimonials-grid");
        // d.testimonials.forEach((t, i) => {
        //   testiGrid.insertAdjacentHTML(
        //     "beforeend",
        //     `<div class="testi-card reveal border border-accent rounded-2xl p-7 transition-colors duration-300 ${i === 1 ? "active" : ""}"
        //       style="transition-delay:${i * 0.1}s">
        //    <p class="text-sm leading-relaxed mb-6">"${t.text}"</p>
        //    <div class="flex items-center gap-3">
        //      <img src="${t.avatar}" alt="${t.name}" class="w-10 h-10 rounded-full object-cover" />
        //      <div>
        //        <p class="font-semibold text-sm">${t.name}</p>
        //        <p class="testi-role text-xs text-muted">${t.role}</p>
        //      </div>
        //    </div>
        //  </div>`,
        //   );
        // });

        // ── Contact ───────────────────────────────────
        document.getElementById("contact-heading").textContent =
          d.contact.heading;
        document.getElementById("contact-subtext").textContent =
          d.contact.subtext;
        const emailEl = document.getElementById("contact-email");
        emailEl.href = `mailto:${d.contact.email}`;
        emailEl.querySelector("span:last-child").textContent = d.contact.email;
        const phoneEl = document.getElementById("contact-phone");
        phoneEl.href = `tel:${d.contact.phone}`;
        phoneEl.querySelector("span:last-child").textContent = d.contact.phone;

        // ── Footer ────────────────────────────────────
        document.getElementById("footer-brand").innerHTML = `
            <img 
                src="${d.footer.brandImage}" 
                alt="Logo"
                class="h-20 w-auto"
            />
            `;
        document.getElementById("footer-copy").textContent = d.footer.copyright;

        // ── Scroll reveal ─────────────────────────────
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("visible");
              }
            });
          },
          { threshold: 0.12 },
        );
        document
          .querySelectorAll(".reveal")
          .forEach((el) => observer.observe(el));

        // ── Navbar shadow on scroll ───────────────────
        window.addEventListener("scroll", () => {
          document
            .getElementById("navbar")
            .classList.toggle("shadow-md", window.scrollY > 10);
        });

        // ── Contact form ──────────────────────────────
        document
          .getElementById("cf-submit")
          .addEventListener("click", async () => {
            const name = document.getElementById("cf-name").value.trim();
            const email = document.getElementById("cf-email").value.trim();
            const project = document.getElementById("cf-project").value.trim();
            const message = document.getElementById("cf-message").value.trim();
            const status = document.getElementById("cf-status");
            const btn = document.getElementById("cf-submit");

            if (!name || !email || !message) {
              status.textContent =
                "Please fill in your name, email, and message.";
              status.className = "text-sm text-red-500";
              status.classList.remove("hidden");
              return;
            }

            btn.disabled = true;
            btn.textContent = "Sending…";
            status.classList.add("hidden");

            try {
              const res = await fetch("/api/contact", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, project, message }),
              });

              const data = await res.json();

              if (res.ok) {
                status.textContent = "Message sent! I'll get back to you soon.";
                status.className = "text-sm text-green-600";
                ["cf-name", "cf-email", "cf-project", "cf-message"].forEach(
                  (id) => {
                    document.getElementById(id).value = "";
                  },
                );
              } else {
                status.textContent =
                  data.error || "Something went wrong. Please try again.";
                status.className = "text-sm text-red-500";
              }
            } catch (err) {
              status.textContent = "Network error. Please try again later.";
              status.className = "text-sm text-red-500";
            } finally {
              status.classList.remove("hidden");
              btn.disabled = false;
              btn.textContent = "Get In Touch";
            }
          });
      })();
    </script>
  </body>
</html>
